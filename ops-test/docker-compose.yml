# =============================================================================
# Vex 云物联 - 测试环境依赖栈 (PostgreSQL + Redis + EMQX)
# 仅用于本地/测试环境启动, 不包含 service 容器 (service 在 IDE 中跑)。
# 启动: docker compose -f ops-test/docker-compose.yml up -d
# 停止: docker compose -f ops-test/docker-compose.yml down
# 清理: docker compose -f ops-test/docker-compose.yml down -v
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 - 业务数据持久化
  # - 默认库名: iot_saas_test (与 dev/prod 库名隔离)
  # - 默认账号: postgres / testpass
  # - 当前使用纯 PG (未启用 TimescaleDB);pointdata 用 JSONB 列存点位 Map
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: iot-test-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    volumes:
      - pg-test-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DB:-iot_saas_test}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-testpass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-iot_saas_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis - 缓存 / Session / 限流 (当前业务尚未引入, 预留)
  # - 无密码, 仅 127.0.0.1 暴露
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: iot-test-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # EMQX 5.x - MQTT Broker
  # - TCP 1883 / WebSocket 8083 / Dashboard 18083
  # - 默认账号: admin / public (Dashboard 登录)
  # - 业务账号 iot/iot (由 application-dev.yml MQTT_USER/MQTT_PASSWORD 匹配)
  # ---------------------------------------------------------------------------
  emqx:
    image: emqx/emqx:5.8
    container_name: iot-test-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT over TCP
      - "8083:8083"   # MQTT over WebSocket
      - "18083:18083" # Dashboard (http://localhost:18083)
    environment:
      # 关闭匿名访问, 强制账号认证 (生产场景配置)
      EMQX_MQTT__NO_ANONYMOUS: "true"
      # Dashboard 默认密码
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
      # 自动创建业务账号 iot / iot (供 application-dev.yml 默认凭证)
      EMQX_AUTH__BUILTIN__USERS__IOT_PASSWORD_HASH: "ZJOWTrXZxYQqjO4dnrCfwg==:TF7nBKCOEyqRKsCrSB65ww=="
    volumes:
      - emqx-test-data:/opt/emqx/data
      - emqx-test-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pg-test-data:
  redis-test-data:
  emqx-test-data:
  emqx-test-log:

# 网络说明: 本栈只跑基础设施, 不连接任何业务 service 容器。
# 业务 service 由开发者本地 IDE 启动, 直接连 localhost:5432 / localhost:6379 / localhost:1883。
# 这样避免了 "本地代码 + 容器数据库" 的版本迭代摩擦。