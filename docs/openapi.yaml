                          description: "条件名称（用户可自定义）"
                        threshold:
                          type: "string"
                          description: "阈值（单阈值时使用）"
                        thresholdHigh:
                          type: "string"
                          description: "阈值上限（BETWEEN 时使用）"
                        level:
                          type: "string"
                          description: "{INFO=提示, WARNING=警告, CRITICAL=紧急, FATAL=严\
                            重}"
                          enum:
                          - "INFO"
                          - "WARNING"
                          - "CRITICAL"
                          - "FATAL"
                        message:
