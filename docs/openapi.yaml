openapi: "3.0.1"
info:
  title: "API Documentation"
  version: "1.0"
paths:
  /api/auth/login:
    post:
      summary: "登录"
      description: "登录"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "challenge"
              - "loginType"
              - "signature"
              - "username"
              type: "object"
              properties:
                username:
                  type: "string"
                  description: "用户名"
                loginType:
                  type: "string"
                  description: "{ADMIN=管理员动态码登录。, USER=普通用户账密登录。}"
                  enum:
                  - "ADMIN"
                  - "USER"
                challenge:
                  type: "string"
                  description: "USER 类型=密码明文；ADMIN 类型=任意占位（后端忽略）"
                signature:
                  type: "string"
                  description: "ADMIN 类型=动态码；USER 类型=任意占位（后端忽略）"
              description: "登录请求"
      responses:
        "200":
          description: "登录响应（包含业务令牌和刷新令牌）"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "string"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "object"
                    properties:
                      accessToken:
                        type: "string"
                        description: ""
                      refreshToken:
                        type: "string"
                        description: ""
                      accessExpiresIn:
                        type: "integer"
                        description: ""
                        format: "int64"
                      refreshExpiresIn:
                        type: "integer"
                        description: ""
                        format: "int64"
                    description: ""
                description: "登录响应（包含业务令牌和刷新令牌）"
  /api/auth/key-info:
    get:
      summary: "密钥信息"
      description: "密钥信息"
      parameters:
      - name: "username"
        in: "query"
        description: "用户名"
        required: true
        schema:
          type: "string"
          nullable: false
      responses:
        "200":
          description: "密钥信息"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "string"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "object"
                    properties:
                      salt:
                        type: "string"
                        description: ""
                      createdAt:
                        type: "string"
                        description: ""
                      windowStart:
                        type: "integer"
                        description: ""
                        format: "int64"
                      windowSeconds:
                        type: "integer"
                        description: ""
                    description: ""
                description: "密钥信息"
  /api/auth/me:
    get:
      summary: "当前用户"
      description: "当前用户"
      responses:
        "200":
          description: "当前用户信息"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "string"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "object"
                    properties:
                      userId:
                        type: "string"
                        description: ""
                      username:
                        type: "string"
                        description: ""
                      tenantId:
                        type: "string"
                        description: ""
                      roles:
                        type: "array"
                        description: ""
                        items:
                          type: "string"
                    description: ""
                description: "当前用户信息"
  /api/auth/refresh:
    post:
      summary: "刷新Token"
      description: "刷新Token"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "refreshToken"
              type: "object"
              properties:
                refreshToken:
                  type: "string"
                  description: ""
              description: "刷新请求（包含刷新令牌）"
      responses:
        "200":
          description: "新的业务令牌和刷新令牌"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "string"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "object"
                    properties:
                      accessToken:
                        type: "string"
                        description: ""
                      refreshToken:
                        type: "string"
                        description: ""
                      accessExpiresIn:
                        type: "integer"
                        description: ""
                        format: "int64"
                      refreshExpiresIn:
                        type: "integer"
                        description: ""
                        format: "int64"
                    description: ""
                description: "新的业务令牌和刷新令牌"
  /api/auth/logout:
    post:
      summary: "登出"
      description: "登出"
      responses:
        "200":
          description: "操作结果"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "string"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "string"
                    description: ""
                description: "操作结果"
