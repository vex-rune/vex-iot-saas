spring:
  application:
    name: iot-saas
  profiles:
    active: dev
  datasource:
    url: ${PG_URL:jdbc:postgresql://localhost:5432/iot_saas}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  quartz:
    # 内存 JobStore，业务表为权威数据源（启动时由 DeviceScheduleBootstrap 加载）
    job-store-type: memory
    properties:
      org:
        quartz:
          threadPool:
            threadCount: 8
            threadNamePrefix: iot-schedule-
          jobStore:
            class: org.quartz.simpl.RAMJobStore

  ai:
    minimax:
      api-key: ${MINIMAX_API_KEY:}
      chat:
        options:
          model: ${AI_LLM_MODEL:MiniMax-Text-01}
          temperature: 0.1
          max-tokens: 2048


# 阿里云短信(可选,未配置时通知降级为日志通道)
vex:
  aliyun:
    sms:
      enabled: ${ALIYUN_SMS_ENABLED:false}
      access-key-id: ${ALIYUN_SMS_AK:}
      access-key-secret: ${ALIYUN_SMS_SK:}
      sign-name: ${ALIYUN_SMS_SIGN:}
      templateCode: ${ALIYUN_SMS_TEMPLATE:}

# JWT 配置
  auth:
    jwt:
      # 密钥必须 32 字节以上,生产必须通过环境变量 JWT_SECRET 注入;
      # 本地启动保留 dev 默认值,生产部署必须显式覆盖,密钥长度低于 32 字节启动失败。
      secret: ${JWT_SECRET:dev_only_change_me_in_prod_secret_key_32b_min}
      # 过期时间(秒),默认 12 小时
      expire-seconds: ${JWT_EXPIRE:43200}
      # Token 请求头
      header: Authorization
      # Token 前缀
      prefix: "Bearer "

  # TOTP 动态码配置（管理员登录使用）
  # 生产部署必须通过环境变量 TOTP_SECRET 注入至少 16 字节密钥
    admin:
      totp:
        secret: ${TOTP_SECRET:comvexiotauth}

  # AI 助手 (LangChain4j + MiniMax via OpenAI 兼容)
  ai:
    base-url: https://token-plan-cn.xiaomimimo.com/v1
    api-key: ${MIMO_API_KEY:}
    model: ${AI_LLM_MODEL:mimo-v2.5}
    temperature: 0.1
    max-tokens: 2048


# 日志
logging:
  level:
    root: INFO
    com.vex.iot: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain