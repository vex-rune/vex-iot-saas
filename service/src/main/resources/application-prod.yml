spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:15432/iot_saas
    username: vex_postgres
    password: ${PG_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

vex:
  # 生产环境严禁自动播种演示数据
  data-seed:
    enabled: true
    # 库中已有设备时是否仍继续播种(会产生重复的告警规则/历史数据)
    force: true

  mqtt:
    connection:
      broker: tcp://127.0.0.1:1883
      username: vex_admin
      password: vex_admin_SDFI3FOUID8
  auth:
    jwt:
      secret: vex_secret_SDFI3123FOUSDFWERFID8
      expire-seconds: 43200
    admin:
      totp:
        secret: ${TOTP_SECRET}

  ai:
    base-url: https://token-plan-cn.xiaomimimo.com/v1
    api-key: ${MIMO_API_KEY:}
    model: mimo-v2.5
    temperature: 0.1
    max-tokens: 2048

server:
  port: 10083

logging:
  level:
    root: WARN
    com.vex.iot: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
