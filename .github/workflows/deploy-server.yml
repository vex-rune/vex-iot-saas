name: Deploy to Server
on:
  push:
    branches:
      - master
      - 'release/*'
    paths:
      - 'service/**'
      - 'deploy-server.yml'
  workflow_dispatch:
    inputs:
      env:
        description: '部署环境'
        required: true
        default: 'prod'
        type: choice
        options: [dev, prod]

env:
  REMOTE_DIR: /app/vex-iot-server
  CONTAINER_PORT: 18083

jobs:
  build:
    name: 🏗️ Maven Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🏗️ Maven 编译
        working-directory: ./service
        run: mvn clean package -DskipTests

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: iot-saas-jar
          path: service/target/iot-saas.jar
          retention-days: 7

  deploy:
    name: 🚀 Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: http://${{ vars.ECS_IP }}:${{ env.CONTAINER_PORT }}

    steps:
      - uses: actions/checkout@v4

      - name: ⬇️ 下载 JAR
        uses: actions/download-artifact@v4
        with:
          name: iot-saas-jar
          path: ./service/target/

      - name: 🔑 配置 SSH
        run: |
          mkdir -p .ssh
          echo "${{ secrets.ALIYUN_ECS_SSH_PRIVATE_KEY }}" > .ssh/id_rsa
          chmod 600 .ssh/id_rsa
          ssh-keyscan -H "${{ vars.ECS_IP }}" >> .ssh/known_hosts 2>/dev/null || true
          echo "✅ SSH 配置完成, ECS=${{ vars.ECS_IP }}"

      - name: 🧪 测试 SSH 连接
        run: |
          ssh -o StrictHostKeyChecking=no -i .ssh/id_rsa root@${{ vars.ECS_IP }} "echo ✅ 连接成功"

      - name: 🛑 停止旧服务
        run: |
          ssh -o StrictHostKeyChecking=no -i .ssh/id_rsa root@${{ vars.ECS_IP }} << 'EOF'
            APP_DIR=/app/vex-iot-server
            mkdir -p $APP_DIR/logs
            PID=$(pgrep -f "vex-iot-server.jar" || true)
            if [[ -n "$PID" ]]; then
              kill "$PID" 2>/dev/null || true
              sleep 3
              kill -9 "$PID" 2>/dev/null || true
            fi
            rm -f $APP_DIR/vex-iot-server.jar $APP_DIR/vex-iot-server.jar.gz
          EOF

      - name: 📤 上传 JAR (gzip 压缩 + scp)
        run: |
          gzip -kf service/target/iot-saas.jar
          scp -o StrictHostKeyChecking=no -i .ssh/id_rsa \
            service/target/iot-saas.jar.gz \
            root@${{ vars.ECS_IP }}:/app/vex-iot-server/vex-iot-server.jar.gz
          echo "✅ JAR 上传完成"

      - name: 📦 解压
        run: |
          ssh -o StrictHostKeyChecking=no -i .ssh/id_rsa root@${{ vars.ECS_IP }} << 'EOF'
            cd /app/vex-iot-server
            gunzip -f vex-iot-server.jar.gz
            ls -lh vex-iot-server.jar
          EOF

      - name: 🚀 启动服务
        run: |
          ssh -o StrictHostKeyChecking=no -i .ssh/id_rsa root@${{ vars.ECS_IP }} << 'REMOTE_EOF'
            cd /app/vex-iot-server
            nohup java \
              -Xms512m -Xmx1024m -XX:+UseG1GC \
              -Dspring.profiles.active=prod \
              -DPG_PASSWORD="${{ vars.PG_PASSWORD }}" \
              -DMQTT_PASSWORD="${{ vars.MQTT_PASSWORD }}" \
              -DJWT_SECRET="${{ vars.JWT_SECRET }}" \
              -DTOTP_SECRET="${{ vars.TOTP_SECRET }}" \
              -DMIMO_API_KEY="${{ vars.MIMO_API_KEY }}" \
              -DMINIMAX_API_KEY="${{ vars.MINIMAX_API_KEY }}" \
              -jar vex-iot-server.jar \
              > logs/startup.log 2>&1 &
            sleep 10
            pgrep -f "vex-iot-server.jar" && echo "✅ 进程已启动" || tail -30 logs/startup.log
          REMOTE_EOF

      - name: 🏥 健康检查
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://${{ vars.ECS_IP }}:${{ env.CONTAINER_PORT }}/actuator/health || echo "000")
            echo "  ($i/12) HTTP $CODE"
            if [[ "$CODE" == "200" ]]; then
              echo "✅ 健康检查通过"
              exit 0
            fi
            sleep 5
          done
          echo "❌ 健康检查失败，拉取启动日志："
          ssh -o StrictHostKeyChecking=no -i .ssh/id_rsa root@${{ vars.ECS_IP }} "tail -80 /app/vex-iot-server/logs/startup.log"
          exit 1
