name: Build & Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  # ─── Job 1: 构建前端 ─────────────────────────────
  build:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.upload.outputs.signed_url }}

    steps:
      - uses: actions/checkout@v4

      - name: 🟢 配置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: 📥 安装依赖
        working-directory: ./app
        run: npm ci

      - name: 🏗️ 构建生产版本
        working-directory: ./app
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_WS_BASE_URL: ${{ vars.VITE_WS_BASE_URL }}
        run: npm run build

      - name: 📤 上传构建产物
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: app/dist/
          retention-days: 7

  # ─── Job 2: 部署到生产 ─────────────────────────────
  deploy:
    name: 🚀 Deploy Frontend
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ vars.ECS_IP }}

    steps:
      - uses: actions/checkout@v4

      - name: ⬇️ 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend-dist/

      - name: 🔑 配置 SSH
        run: |
          mkdir -p .ssh
          echo "${{ secrets.ALIYUN_ECS_SSH_PRIVATE_KEY }}" > .ssh/id_rsa
          chmod 600 .ssh/id_rsa
          ECS_IP="${ECS_IP:-${ALIYUN_ECS_IP:-8.160.183.109}}"
          echo "$ECS_IP" > .ssh/host_ecs_ip.txt
          ssh-keyscan -H "$ECS_IP" >> .ssh/known_hosts 2>/dev/null || true
          echo "ECS_IP=$ECS_IP" >> $GITHUB_ENV
          echo "✅ SSH 配置完成"

      - name: 📦 部署前端到 Nginx 目录
        run: |
          # 默认 Nginx root 目录, 可通过 FRONTEND_DEPLOY_DIR 变量覆盖
          DEPLOY_DIR="${FRONTEND_DEPLOY_DIR:-/var/www/vex-iot-web}"
          
          # 打包并压缩 (tar.gz 双层压缩)
          tar czf frontend-dist.tar.gz -C frontend-dist .
          ls -lh frontend-dist.tar.gz
          
          # 上传到服务器
          ssh -o Compression=yes -i .ssh/id_rsa root@${{ env.ECS_IP }} << EOF
            mkdir -p $DEPLOY_DIR
            [ -d $DEPLOY_DIR/assets ] && mv $DEPLOY_DIR $DEPLOY_DIR.bak.\$(date +%Y%m%d%H%M%S) || true
            cd $DEPLOY_DIR
            sftp -o Compression=yes -i $GITHUB_WORKSPACE/.ssh/id_rsa root@127.0.0.1 << SFTP_EOF
              put $GITHUB_WORKSPACE/frontend-dist.tar.gz frontend-dist.tar.gz
              bye
            SFTP_EOF
          EOF

          ssh -o StrictHostKeyChecking=no -i .ssh/id_rsa root@${{ env.ECS_IP }} << EOF
            cd $DEPLOY_DIR
            tar xzf frontend-dist.tar.gz
            rm frontend-dist.tar.gz
            ls -lh
          EOF

      - name: 🔄 重载 Nginx
        run: |
          # 尝试 nginx 重载 (兼容 nginx 安装方式)
          ssh -o StrictHostKeyChecking=no -i .ssh/id_rsa root@${{ env.ECS_IP }} << 'EOF'
            if command -v nginx &>/dev/null; then
              nginx -t && nginx -s reload 2>/dev/null || systemctl reload nginx 2>/dev/null || service nginx reload
              echo "✅ Nginx 已重载"
            else
              echo "⚠️ Nginx 未安装, 前端静态文件已就绪, 需手动配置 Web 服务器"
              ls -lh /var/www/vex-iot-web/
            fi
          EOF

      - name: 🏥 健康检查
        run: |
          sleep 3
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://${{ env.ECS_IP }} || echo "000")
          echo "前端首页 HTTP $CODE"
          if [[ "$CODE" != "200" ]]; then
            echo "❌ 前端不可访问"
            exit 1
          fi
          echo "✅ 前端部署成功"