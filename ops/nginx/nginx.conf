# Vex 云物联 - Nginx 负载均衡配置(占位)
# 生产部署请按真实证书路径、域名调整
#
# 域名规划:
#   - 官方网站: vexrune.top  /  www.vexrune.top   (官方门户,首页/营销页)
#   - 控制台:   console.vexrune.top                (即本 SPA,管理后台)
#   - 后端 API: api.vexrune.top                    (SpringBoot,反代到 upstream)
#
# 反代建议:
#   server_name console.vexrune.top;
#   location / { try_files $uri $uri/ /index.html; }     # SPA 兜底
#   location /api/ { proxy_pass http://iot-saas-backend; }

user  nginx;
worker_processes  auto;

events {
    worker_connections  4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    gzip  on;

    # 上游 SpringBoot 实例
    upstream iot-saas-backend {
        server 127.0.0.1:8080 weight=1;
        server 127.0.0.1:8081 weight=1;
        keepalive 32;
    }

    # 静态前端 (官网 + 控制台 SPA 占位,生产请使用真实域名)
    # 控制台域名: console.vexrune.top
    # 官方站点:   vexrune.top  (首页)
    server {
        listen 80;
        # 生产请改为: server_name console.vexrune.top;
        server_name _;

        # 前端 SPA
        root /opt/iot-saas/app/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 后端 API 反向代理
        location /api/ {
            proxy_pass http://iot-saas-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger / Knife4j
        location /swagger-ui.html {
            proxy_pass http://iot-saas-backend;
        }
        location /v3/api-docs {
            proxy_pass http://iot-saas-backend;
        }
        location /doc.html {
            proxy_pass http://iot-saas-backend;
        }
        location /webjars/ {
            proxy_pass http://iot-saas-backend;
        }
    }

    # HTTPS 站点(占位)
    # server {
    #     listen 443 ssl;
    #     # 官方网站
    #     server_name vexrune.top www.vexrune.top;
    #     # 控制台子域名
    #     # server_name console.vexrune.top;
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ...
    # }
}