<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Vex 云物联">
  <defs>
    <linearGradient id="vex-bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="vex-shine" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- iOS 自动圆角: 实绘方形, 系统裁剪为圆角 -->
  <rect width="180" height="180" rx="38" fill="url(#vex-bg)"/>
  <!-- 左上角柔和高光 -->
  <rect width="180" height="180" rx="38" fill="url(#vex-shine)"/>
  <!-- V 字主体 -->
  <path d="M42 58 L90 130 L138 58"
        stroke="white" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- 顶端节点: 设备/传感器 -->
  <circle cx="90" cy="36" r="9" fill="white"/>
  <!-- 节点与 V 之间的连接: 表达上行链路 -->
  <path d="M90 49 L90 66" stroke="white" stroke-width="8" stroke-linecap="round"/>
</svg>
