<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Vex 云物联">
  <defs>
    <linearGradient id="vex-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- 圆角方形品牌底 -->
  <rect width="32" height="32" rx="7" fill="url(#vex-bg)"/>
  <!-- 高光, 让图标在浅色背景更立体 -->
  <rect x="0" y="0" width="32" height="14" rx="7" fill="white" opacity="0.08"/>
  <!-- "V" 字形: 两笔粗斜线在底部汇聚, 形成 Vex 品牌首字母 -->
  <path d="M7.5 10.5 L16 23 L24.5 10.5"
        stroke="white" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- 顶端信号节点: 一颗小白点代表接入设备/传感器 -->
  <circle cx="16" cy="6.5" r="1.6" fill="white"/>
  <!-- 节点与 V 之间的连接线, 表达"设备→平台"上行链路 -->
  <path d="M16 8.4 L16 11.6" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
</svg>
